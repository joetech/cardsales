<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PSA Cert Censor</title>
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; background: #f5f5f5; color: #111; }
    .app { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    .controls { display: grid; gap: 12px; margin-bottom: 16px; }
    label { font-weight: 600; display: block; margin-bottom: 4px; }
    input, select, button { font: inherit; padding: 8px; }
    input[type="url"] { width: 100%; box-sizing: border-box; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .fine-tune { display: grid; grid-template-columns: repeat(4, minmax(120px, 1fr)); gap: 10px; max-width: 720px; }
    .fine-tune input { width: 100%; box-sizing: border-box; }
    fieldset { border: 1px solid #ddd; border-radius: 8px; padding: 12px; max-width: 760px; }
    legend { font-weight: 700; padding: 0 6px; }
    .canvas-wrap { position: relative; display: inline-block; max-width: 100%; }
    canvas { max-width: 100%; height: auto; display: block; border: 1px solid #ccc; background: #eee; margin-top: 16px; }
    #downloadBtn { display: none; margin-top: 12px; }
    .note { color: #555; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <div style="font-size:14px; text-align:left;">
        Brought to you by Card Warehouse. <b><a href="https://district.net/u/cwbreaks" target="_blank">Shop here</a></b>.<br>New buyers get $5 off with code: <b>CWBREA64</b><br>
        Get this script <a href="https://github.com/joetech/cardsales/blob/main/tools/cert-censor.html" target="_blank">here</a>.
      </div>
      <h1>PSA Cert Censor</h1>
      <div style="font-size:14px; text-align:right;">
        Brought to you by Card Warehouse. <b><a href="https://district.net/u/cwbreaks" target="_blank">Shop here</a></b>.<br>New buyers get $5 off with code: <b>CWBREA64</b><br>
        Get this script <a href="https://github.com/joetech/cardsales/blob/main/tools/cert-censor.html" target="_blank">here</a>.
      </div>
    </div>

    <div class="controls">
      <div><label>Upload image</label><input id="fileInput" type="file" accept="image/*" /></div>
      <div><label>Or image URL</label><div class="row"><input id="urlInput" type="url" /><button id="loadUrlBtn">Load URL</button></div></div>

      <div class="row">
        <label>Image side</label>
        <select id="sideSelect"><option value="front">Front</option><option value="back">Back</option></select>
        <button id="applyBtn">Apply black rectangles</button>
        <button id="resetBtn">Reset boxes</button>
      </div>

      <div><label>Name in boxes</label><input id="nameInput" type="text" value="cwbreaks" /></div>

      <fieldset>
        <legend>Certification box</legend>
        <div class="fine-tune">
          <input id="certXInput" type="number" step="0.1" />
          <input id="certYInput" type="number" step="0.1" />
          <input id="certWInput" type="number" step="0.1" />
          <input id="certHInput" type="number" step="0.1" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Left barcode</legend>
        <div class="fine-tune">
          <input id="barcodeXInput" type="number" step="0.1" />
          <input id="barcodeYInput" type="number" step="0.1" />
          <input id="barcodeWInput" type="number" step="0.1" />
          <input id="barcodeHInput" type="number" step="0.1" />
        </div>
      </fieldset>

      <fieldset>
        <legend>Back QR code</legend>
        <div class="fine-tune">
          <input id="qrXInput" type="number" step="0.1" />
          <input id="qrYInput" type="number" step="0.1" />
          <input id="qrWInput" type="number" step="0.1" />
          <input id="qrHInput" type="number" step="0.1" />
        </div>
      </fieldset>
    </div>

    <canvas id="canvas"></canvas>
    <button id="downloadBtn">Download</button>
  </div>

  <script>
    const el = id => document.getElementById(id);

    const inputs = {
      cert: ['certXInput','certYInput','certWInput','certHInput'],
      barcode: ['barcodeXInput','barcodeYInput','barcodeWInput','barcodeHInput'],
      qr: ['qrXInput','qrYInput','qrWInput','qrHInput']
    };

    const nameInput = el('nameInput');
    const canvas = el('canvas');
    const ctx = canvas.getContext('2d');

    let img=null, boxes={};

    const defaults={
      front:{cert:{x:66.4,y:14,w:23,h:2.3},barcode:{x:11,y:14,w:25,h:2.8}},
      back:{cert:{x:65,y:16.4,w:25,h:2.4},barcode:{x:11,y:16.5,w:25,h:2.8},qr:{x:68,y:5.2,w:17,h:10}}
    };

    function setDefaults(){
      const side=el('sideSelect').value;
      boxes=JSON.parse(JSON.stringify(defaults[side]));
      write();
    }

    function write(){
      Object.entries(boxes).forEach(([k,v])=>{
        inputs[k]?.forEach((id,i)=>el(id).value=Object.values(v)[i]);
      });
    }

    function read(){
      Object.keys(inputs).forEach(k=>{
        if(!inputs[k])return;
        const vals=inputs[k].map(id=>Number(el(id).value));
        if(!boxes[k]) boxes[k]={};
        [boxes[k].x,boxes[k].y,boxes[k].w,boxes[k].h]=vals;
      });
    }

    function draw(){
      if(!img)return;
      canvas.width=img.naturalWidth;
      canvas.height=img.naturalHeight;
      ctx.drawImage(img,0,0);

      Object.entries(boxes).forEach(([k,b])=>{
        const p=toPx(b);
        ctx.fillStyle='black';
        ctx.fillRect(p.x,p.y,p.w,p.h);
        if(k !== 'qr') drawText(p);
      });
    }

    function toPx(b){
      return {
        x:(b.x/100)*canvas.width,
        y:(b.y/100)*canvas.height,
        w:(b.w/100)*canvas.width,
        h:(b.h/100)*canvas.height
      };
    }

    function drawText(p){
      const t=nameInput.value?.trim();
      if(!t)return;
      ctx.fillStyle='#ccc';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.font=`${Math.floor(p.h*0.6)}px sans-serif`;
      ctx.fillText(t,p.x+p.w/2,p.y+p.h/2);
    }

    el('fileInput').onchange=e=>{
      const r=new FileReader();
      r.onload=()=>{img=new Image();img.onload=()=>{setDefaults();draw();el('downloadBtn').style.display='inline-block';};img.src=r.result;};
      r.readAsDataURL(e.target.files[0]);
    };

    el('loadUrlBtn').onclick=()=>{
      img=new Image();img.crossOrigin='anonymous';
      img.onload=()=>{setDefaults();draw();el('downloadBtn').style.display='inline-block';};
      img.src=el('urlInput').value;
    };

    el('applyBtn').onclick=()=>{read();draw();};
    el('resetBtn').onclick=()=>{setDefaults();draw();};
    el('sideSelect').onchange=()=>{setDefaults();draw();};

    [...Object.values(inputs).flat(), 'nameInput'].forEach(id=>{
      el(id).oninput=()=>{read();draw();};
    });

    el('downloadBtn').onclick=()=>{
      const a=document.createElement('a');
      a.href=canvas.toDataURL();
      a.download='censored.png';
      a.click();
    };

    setDefaults();
  </script>
</body>
</html>
